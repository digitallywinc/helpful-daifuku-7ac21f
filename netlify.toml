[build]
  command = "npm install && npm --prefix server install && npm --prefix client install && npm --prefix server run build && npm --prefix client run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"

# Send API requests to the Express serverless function before the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# React Router routes (for example /login and /dashboard).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
